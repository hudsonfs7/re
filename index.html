<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0f1e">
<title>Quiz · Recurso Extraordinário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0f1e;--panel:#141f3d;--line:#26345e;--ink:#eef1f8;--dim:#9aa6c4;--gold:#e3b54a;--red:#ff5a6a;--green:#35d399}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}
body{background:radial-gradient(600px 400px at 100% 0,#1d2b57,transparent 60%),var(--bg);min-height:100dvh;display:flex;flex-direction:column;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;color:var(--dim)}
.me{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);padding:8px 12px;border-radius:999px;font-weight:600;color:var(--ink);max-width:70%}
.me span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me button{background:none;border:0;color:var(--gold);font:600 12px Inter;cursor:pointer;flex:none}
.st{display:flex;align-items:center;gap:6px}
.st i{width:9px;height:9px;border-radius:50%;background:#555}.st i.ok{background:var(--green)}.st i.warn{background:var(--gold)}
main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:20px 0;max-width:560px;width:100%;margin:0 auto}
.eyebrow{font-weight:800;font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);margin-bottom:10px}
h1{font:600 30px/1.15 Fraunces,serif;margin-bottom:12px}
.q{font:600 24px/1.3 Fraunces,serif;margin-bottom:26px}
p{color:var(--dim);font-size:16px;line-height:1.5}
.btns{display:grid;gap:14px}
.btn{border:0;border-radius:22px;padding:28px 16px;font:800 24px Inter;letter-spacing:.08em;color:#fff;cursor:pointer;transition:transform .12s,box-shadow .2s,opacity .2s;position:relative}
.btn:active{transform:scale(.97)}
.btn.v{background:linear-gradient(135deg,#2bbd87,#1d8b65)} .btn.f{background:linear-gradient(135deg,#ff6b7a,#b7323f)}
.btns.voted .btn{opacity:.35}
.btns.voted .btn.sel{opacity:1;box-shadow:0 0 0 4px #fff,0 0 40px #ffffff55}
.btn.sel::after{content:"✓ seu voto";position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:13px;letter-spacing:.06em;background:#0003;padding:6px 10px;border-radius:999px}
.note{margin-top:16px;text-align:center;font-size:14px;color:var(--dim);min-height:20px}
.timer{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:22px}
.timer div{height:100%;background:var(--gold);width:100%;transition:width .3s linear}
.res{border-radius:22px;padding:24px;text-align:center;margin-bottom:18px}
.res.ok{background:#35d39920;border:1px solid var(--green)} .res.bad{background:#ff5a6a20;border:1px solid var(--red)} .res.none{background:var(--panel);border:1px solid var(--line)}
.res b{display:block;font:800 30px Fraunces,serif;margin-bottom:6px}
.res.ok b{color:var(--green)} .res.bad b{color:var(--red)}
.just{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;font-size:16px;line-height:1.5}
.just small{display:block;color:var(--gold);font-weight:600;margin-top:8px}
.big{font:800 64px Fraunces,serif;color:var(--gold);line-height:1}
.center{text-align:center}
.pulse{width:70px;height:70px;border-radius:50%;margin:0 auto 24px;border:3px solid var(--gold);animation:p 1.6s infinite}
@keyframes p{50%{transform:scale(.8);opacity:.5}}
.score{display:flex;justify-content:center;gap:24px;margin:10px 0 20px}
.score div{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 18px;min-width:110px}
.score b{display:block;font:800 30px Fraunces,serif;color:var(--gold)}
.score span{font-size:12px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase}
footer{font-size:12px;color:#5d6888;text-align:center}
.namebox{margin-top:28px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px}
.namebox label{display:block;font-weight:700;font-size:15px;margin-bottom:10px}
.namebox div{display:flex;gap:8px}
.namebox input{flex:1;min-width:0;background:#0a0f1e;border:1px solid var(--line);border-radius:12px;padding:14px;color:var(--ink);font:600 17px Inter}
.namebox input:focus{outline:2px solid var(--gold);border-color:transparent}
.namebox button{background:var(--gold);color:#0a0f1e;border:0;border-radius:12px;padding:0 18px;font:800 15px Inter;cursor:pointer}
.namebox small{display:block;margin-top:10px;color:var(--dim);font-size:13px}
.pop{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.7);opacity:0}}
</style>
</head>
<body>
<header>
  <div class="me"><span id="nick">…</span><button id="edit" type="button">trocar</button></div>
  <div class="st"><i id="dot"></i><span id="stt">conectando…</span></div>
</header>
<main id="view"><div class="center"><div class="pulse"></div><p>Conectando à votação…</p></div></main>
<footer>Recurso Extraordinário · Direito do Trabalho</footer>

<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script src="shared.js?v=8"></script>
<script>
(() => {
  const { CONFIG, QUESTIONS, uid, randomNick, store, createBus } = window.RE;
  const KEY = "re_voter_" + CONFIG.ROOM;
  const me = store.get(KEY) || { id: uid(10), votes: {} };
  if (!me.nick || /^Min\. /.test(me.nick)) { me.nick = randomNick(); me.named = false; }
  store.set(KEY, me);
  const $ = (s) => document.querySelector(s);
  const view = $("#view");
  $("#nick").textContent = me.nick;
  function setName(n) {
    n = String(n || "").trim().replace(/\s+/g, " ").slice(0, 24);
    if (!n) return false;
    me.nick = n; me.named = true; store.set(KEY, me);
    $("#nick").textContent = me.nick; hello();
    return true;
  }
  $("#edit").onclick = () => {
    const box = document.getElementById("nm");
    if (box) { box.focus(); box.select(); return; }
    const n = prompt("Seu nome no ranking:", me.named ? me.nick : "");
    setName(n);
  };
  // campo de nome (aparece enquanto o quiz não começou)
  function nameBox() {
    return `<form class="namebox" id="nmf" autocomplete="off">
      <label for="nm">${me.named ? "Seu nome no ranking" : "Qual seu nome? (opcional)"}</label>
      <div><input id="nm" maxlength="24" placeholder="Ex.: Ana, Pedro S." value="${me.named ? esc(me.nick) : ""}"><button type="submit">${me.named ? "Trocar" : "Salvar"}</button></div>
      <small>${me.named ? "Pronto! É assim que você aparece no ranking." : `Se não preencher, você aparece como “${esc(me.nick)}”.`}</small>
    </form>`;
  }
  function bindNameBox() {
    const f = document.getElementById("nmf"); if (!f) return;
    f.onsubmit = (e) => { e.preventDefault(); if (setName(document.getElementById("nm").value)) render(true); };
  }

  let st = null, lastKey = "", openedAtLocal = 0;
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  const bus = createBus({
    subs: ["state"],
    ntfySince: { state: "20m" },
    onMessage(kind, m) {
      if (kind !== "state") return;
      if (st && m.ts < st.ts) return; // ignora estado antigo
      if (st && m.session !== st.session) me.votes = {};
      if (!me.session || me.session !== m.session) { me.session = m.session; me.votes = {}; store.set(KEY, me); }
      st = m; render();
    },
    onStatus(s) {
      const d = $("#dot");
      d.className = s.mqtt ? "ok" : s.ntfy ? "warn" : "";
      $("#stt").textContent = s.mqtt || s.ntfy ? "ao vivo" : "reconectando…";
      if ((s.mqtt || s.ntfy) && !bus._hello) { bus._hello = true; hello(); resend(); }
    },
  });
  function hello() { bus.publish("hello", { id: me.id, nick: me.nick, session: me.session }); }
  setInterval(() => { if (!document.hidden) hello(); }, 30000);
  function resend() { // reenvia o voto se caiu a conexão
    if (st && st.phase === "open" && me.votes[st.q]) send(st.q, me.votes[st.q]);
  }

  function send(q, a) {
    bus.publish("vote", { id: me.id, nick: me.nick, session: st.session, q, a });
  }
  function vote(a) {
    if (!st || st.phase !== "open") return;
    me.votes[st.q] = a; store.set(KEY, me);
    send(st.q, a);
    if (navigator.vibrate) navigator.vibrate(30);
    render(true);
  }

  function hits() {
    let h = 0, n = 0;
    for (let q = 0; q < QUESTIONS.length; q++) {
      if (me.votes[q] == null || !(me.revealed || {})[q]) continue;
      n++; if ((me.votes[q] === "V") === QUESTIONS[q].a) h++;
    }
    return { h, n };
  }

  function render(force) {
    if (!st) return;
    const key = st.phase + ":" + st.q + ":" + st.session;
    const changed = key !== lastKey; lastKey = key;
    if (!changed && !force) { // só atualiza contadores
      const c = document.getElementById("cnt"); if (c && st.n != null) c.textContent = st.n;
      return;
    }
    const Q = st.q != null ? QUESTIONS[st.q] : null;
    if (st.phase === "open") {
      if (changed) openedAtLocal = Date.now();
      const my = me.votes[st.q];
      view.innerHTML = `
        <div class="eyebrow">Pergunta ${st.q + 1} de ${QUESTIONS.length}</div>
        <div class="timer"><div id="tb"></div></div>
        <div class="q">${esc(Q.t)}</div>
        <div class="btns ${my ? "voted" : ""}">
          <button class="btn v ${my === "V" ? "sel" : ""}" data-a="V">VERDADEIRO</button>
          <button class="btn f ${my === "F" ? "sel" : ""}" data-a="F">FALSO</button>
        </div>
        <div class="note">${my ? "Voto registrado! Você ainda pode mudar até o tempo acabar." : "Toque para votar. Quanto mais rápido, mais pontos."}</div>
        <p class="center" style="margin-top:8px;font-size:13px"><b id="cnt">${st.n || 0}</b> votos na turma</p>`;
      view.querySelectorAll(".btn").forEach((b) => (b.onclick = () => vote(b.dataset.a)));
    } else if (st.phase === "closed") {
      view.innerHTML = `<div class="center pop"><div class="pulse"></div><h1>Votação encerrada</h1><p>Olhe para o telão: a resposta vem aí…</p></div>`;
    } else if (st.phase === "reveal") {
      me.revealed = me.revealed || {}; me.revealed[st.q] = true; store.set(KEY, me);
      const my = me.votes[st.q];
      const ok = my && (my === "V") === Q.a;
      const { h, n } = hits();
      view.innerHTML = `
        <div class="res ${!my ? "none" : ok ? "ok" : "bad"} pop"><b>${!my ? "Você não votou" : ok ? "Acertou! ⚖️" : "Errou…"}</b>A resposta é <b style="display:inline;font-size:inherit">${Q.a ? "VERDADEIRO" : "FALSO"}</b></div>
        <div class="just">${esc(Q.j)}<small>${esc(Q.base)}</small></div>
        <p class="center" style="margin-top:18px">Seu placar: <b style="color:var(--gold)">${h}</b> de ${n}</p>`;
    } else if (st.phase === "end") {
      const top = st.top || [];
      const pos = top.findIndex((p) => p.id === me.id);
      const { h } = hits();
      view.innerHTML = `<div class="center pop">
        <div class="eyebrow">Resultado</div>
        ${pos >= 0 ? `<div class="big">${pos + 1}º</div><h1 style="margin-top:10px">${pos === 0 ? "Presidente do Plenário! 🏆" : "Você está no Plenário da turma! ⚖️"}</h1>` : `<h1>Fim do quiz!</h1><p>Não foi dessa vez no Plenário, mas valeu a participação.</p>`}
        <div class="score"><div><b>${h}</b><span>acertos</span></div>${pos >= 0 ? `<div><b>${top[pos].pts}</b><span>pontos</span></div>` : ""}</div>
        <p>Obrigado por participar! 👏</p></div>`;
    } else if (st.phase === "lobby") {
      view.innerHTML = `<div class="center pop"><div class="eyebrow">Você entrou! ✅</div><h1>O quiz já vai começar</h1><p>As perguntas aparecem nesta tela sozinhas. Deixe a página aberta.</p></div>${nameBox()}`;
      bindNameBox();
    } else {
      view.innerHTML = `<div class="center pop"><h1>Tudo certo por aqui ✅</h1><p>A apresentação está rolando. Quando o quiz começar, as perguntas aparecem nesta tela sozinhas. Deixe a página aberta.</p></div>${nameBox()}`;
      bindNameBox();
    }
  }

  // barra de tempo (aproximada, só visual)
  setInterval(() => {
    const tb = document.getElementById("tb");
    if (!tb || !st || st.phase !== "open") return;
    const left = Math.max(0, 1 - (Date.now() - openedAtLocal) / (CONFIG.QUESTION_TIME * 1000));
    tb.style.width = left * 100 + "%";
  }, 300);
})();
</script>
</body>
</html>
